name: Test

on:
  pull_request:
    branches: "v2-refactor"
    paths:
      - 'src/**'
      - 'tests/**'
jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v7.3.1
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install dependencies
        run: uv sync --extra test --extra all

      - name: Set up sbs_data submodule
        run: |
          git submodule init
          git submodule update

      - name: Run tests
        run: uv run pytest -n auto -L
